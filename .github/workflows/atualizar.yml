name: Atualizar dados da ANAC e publicar o site

on:
  # A ANAC publica o mês anterior perto do fim do mês seguinte; o robô confere
  # todo dia e só baixa quando aparece um mês novo.
  schedule:
    - cron: "41 10 * * *"
  # Botão "Run workflow" na aba Actions
  workflow_dispatch:
    inputs:
      forcar:
        description: "Baixar de novo todos os meses"
        type: boolean
        default: false
  # Roda quando o código do robô ou do site muda
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "site/**"
      - ".github/workflows/atualizar.yml"
      - "adsense.txt"
      - "afiliado_indenizacao.txt"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # O site é publicado direto pelo Actions; as páginas (docs/) não ficam no repositório.
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests==2.32.3 pillow==11.3.0 openpyxl==3.1.5

      - name: Baixar dados da ANAC
        id: robo
        continue-on-error: true
        env:
          FORCAR: ${{ (github.event_name == 'workflow_dispatch' && inputs.forcar) && '1' || '0' }}
        run: python scripts/atualizar.py

      - name: Baixar demanda da ANAC (passageiros e ocupação)
        id: demanda
        continue-on-error: true
        env:
          FORCAR: ${{ (github.event_name == 'workflow_dispatch' && inputs.forcar) && '1' || '0' }}
        run: python scripts/atualizar_demanda.py

      - name: Baixar tarifas da ANAC (preço das passagens)
        id: tarifas
        continue-on-error: true
        env:
          FORCAR: ${{ (github.event_name == 'workflow_dispatch' && inputs.forcar) && '1' || '0' }}
        run: python scripts/atualizar_tarifas.py

      - name: Baixar clima das cidades (Inmet e NASA POWER; só quando falta)
        id: clima
        continue-on-error: true
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
        run: python scripts/atualizar_clima.py

      - name: Gerar site
        if: always()
        run: python scripts/gerar_site.py

      - name: Salvar no repositório
        if: always()
        run: |
          git config user.name "Voo em Números (robô)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "Dados atualizados: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: IndexNow, o que mudou nesta publicação
        run: python scripts/indexnow.py preparar docs https://vooemnumeros.com.br 260b8d55d9f4015cf31cb76a463ba076

      - name: Empacotar site
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publicar no GitHub Pages
        id: publicar
        if: always()
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # o GitHub às vezes ainda não "enxerga" o pacote recém-enviado ("No artifacts named github-pages"):
      # espera um pouco e tenta de novo, em vez de o site ficar sem publicar
      - name: Esperar antes de tentar publicar de novo
        if: always() && steps.publicar.outcome == 'failure'
        run: sleep 45

      - name: Publicar no GitHub Pages (segunda tentativa)
        id: publicar2
        if: always() && steps.publicar.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: IndexNow, avisar o Bing das páginas que mudaram
        continue-on-error: true
        run: python scripts/indexnow.py enviar docs https://vooemnumeros.com.br 260b8d55d9f4015cf31cb76a463ba076

      - name: Falhar se o robô falhou
        if: steps.robo.outcome == 'failure'
        run: |
          echo "O robô falhou. Veja o log acima e data/debug.json."
          exit 1
