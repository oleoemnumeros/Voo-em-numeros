name: Sondar fontes da ANAC

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/sondar_anac.py"
      - ".github/workflows/sondar.yml"

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - run: python scripts/sondar_anac.py
